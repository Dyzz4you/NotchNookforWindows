[package]
name = "notch-nook"
version = "0.8.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
drag = "2"
windows = { version = "0.61", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Win32_System_WinRT", "Devices_Bluetooth", "Devices_Enumeration", "Devices_Radios", "Networking_Connectivity", "Devices_WiFi", "Security_Credentials", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
